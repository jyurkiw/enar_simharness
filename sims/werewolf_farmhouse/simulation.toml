# The werewolf pack, but on the actual farmhouse-ruin map instead of an open
# room. Same premise as sims/werewolf_pack (6 werewolves, fight to the death,
# rush the party) — the only change is the BOARD, to measure how much the real
# terrain matters.
#
# On `plain_room` (open, 30 ft apart) six werewolves are a guaranteed TPK: all
# six reach melee in round one and swarm. The farmhouse is different — the party
# spawns in the east corner, the wolves start scattered 20-65 ft away across the
# ruin interior, and there are walls, windows (three-quarters cover) and debris
# (difficult terrain) between. If the terrain staggers the pack's arrival — so
# the party faces two or three wolves at a time instead of all six at once —
# the same six wolves become a very different fight.
#
# `[sweep]` runs both level-5 parties (standard adventurers / alternate vanguard)
# on the farmhouse. See the count x tactics analysis in the session notes for
# the fuller picture; this file is the canonical 6-wolf, real-map scenario.
name = "werewolf_farmhouse"
description = "6 werewolves on the farmhouse-ruin map vs a level-5 party (standard and alternate)"

board = "lib:farmhouse_ruin"

[simulation]
trials = 5000
max_rounds = 15
seed = 20260720

[[combatants]]
creature = "champion_fighter"
side = "party"
spawn = "party"

[[combatants]]
creature = "hunter_ranger"
side = "party"
spawn = "party"

[[combatants]]
creature = "thief_rogue"
side = "party"
spawn = "party"

[[combatants]]
creature = "life_cleric"
side = "party"
spawn = "party"

[[combatants]]
creature = "evoker_wizard"
side = "party"
spawn = "party"

[[combatants]]
creature = "werewolf"
side = "monsters"
spawn = "monsters"
count = 6

[[sweep.axes]]
target = "combatants"
values = [
  [
    { creature = "champion_fighter", side = "party", spawn = "party" },
    { creature = "hunter_ranger", side = "party", spawn = "party" },
    { creature = "thief_rogue", side = "party", spawn = "party" },
    { creature = "life_cleric", side = "party", spawn = "party" },
    { creature = "evoker_wizard", side = "party", spawn = "party" },
    { creature = "werewolf", side = "monsters", spawn = "monsters", count = 6 },
  ],
  [
    { creature = "berserker_barbarian", side = "party", spawn = "party" },
    { creature = "devotion_paladin", side = "party", spawn = "party" },
    { creature = "martial_arts_monk", side = "party", spawn = "party" },
    { creature = "life_cleric", side = "party", spawn = "party" },
    { creature = "evoker_wizard", side = "party", spawn = "party" },
    { creature = "werewolf", side = "monsters", spawn = "monsters", count = 6 },
  ],
]

[sweep]
columns = ["side_dealt_party", "side_dealt_monsters", "wiped_party", "wiped_monsters"]

[output]
report = ["totals", "survival"]
