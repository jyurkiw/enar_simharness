# The werewolf pack on the actual farmhouse-ruin map instead of an open room.
# The pack is the TUNED composition: 3 werewolves + 4 wolves, not the raw 6
# werewolves — six werewolves are a guaranteed TPK on open ground, so this trades
# a few down to CR-1/4 wolves that punch above their cost (Pack Tactics + a
# knockdown-to-Prone bite) to keep the fight hard-but-winnable and more varied.
# The premise is unchanged: the pack rushes and fights to the death.
#
# The farmhouse terrain is the point of this variant. The party spawns in the
# east corner; the pack starts scattered 20-65 ft away across the ruin interior,
# with walls, windows (three-quarters cover) and debris (difficult terrain)
# between. If the terrain staggers the pack's arrival — so the party faces two
# or three at a time instead of the whole pack at once — the same pack becomes a
# very different fight than it is on `plain_room`.
#
# `[sweep]` runs both level-5 parties (standard adventurers / alternate vanguard)
# on the farmhouse. See sims/werewolf_pack for the open-room baseline and the
# session notes for the fuller count x composition analysis.
name = "werewolf_farmhouse"
description = "3 werewolves + 4 wolves on the farmhouse-ruin map vs a level-5 party (standard and alternate)"

board = "lib:farmhouse_ruin"

[simulation]
trials = 5000
max_rounds = 15
seed = 20260720

[[combatants]]
creature = "champion_fighter"
side = "party"
spawn = "party"

[[combatants]]
creature = "hunter_ranger"
side = "party"
spawn = "party"

[[combatants]]
creature = "thief_rogue"
side = "party"
spawn = "party"

[[combatants]]
creature = "life_cleric"
side = "party"
spawn = "party"

[[combatants]]
creature = "evoker_wizard"
side = "party"
spawn = "party"

[[combatants]]
creature = "werewolf"
side = "monsters"
spawn = "monsters"
count = 3

[[combatants]]
creature = "wolf"
side = "monsters"
spawn = "monsters"
count = 4

[[sweep.axes]]
target = "combatants"
values = [
  [
    { creature = "champion_fighter", side = "party", spawn = "party" },
    { creature = "hunter_ranger", side = "party", spawn = "party" },
    { creature = "thief_rogue", side = "party", spawn = "party" },
    { creature = "life_cleric", side = "party", spawn = "party" },
    { creature = "evoker_wizard", side = "party", spawn = "party" },
    { creature = "werewolf", side = "monsters", spawn = "monsters", count = 3 },
    { creature = "wolf", side = "monsters", spawn = "monsters", count = 4 },
  ],
  [
    { creature = "berserker_barbarian", side = "party", spawn = "party" },
    { creature = "devotion_paladin", side = "party", spawn = "party" },
    { creature = "martial_arts_monk", side = "party", spawn = "party" },
    { creature = "life_cleric", side = "party", spawn = "party" },
    { creature = "evoker_wizard", side = "party", spawn = "party" },
    { creature = "werewolf", side = "monsters", spawn = "monsters", count = 3 },
    { creature = "wolf", side = "monsters", spawn = "monsters", count = 4 },
  ],
]

[sweep]
columns = ["side_dealt_party", "side_dealt_monsters", "wiped_party", "wiped_monsters"]

[output]
report = ["totals", "survival"]
