# Single CR5 Otyugh vs the reusable level-5 "adventurers" party (champion
# fighter, hunter ranger, thief rogue, life cleric, evoker wizard). Ported
# from dnd/otyugh/otyugh_cr5_dps/src/scenario.toml (design doc 05's migration
# checklist row 2) — the party/monster stats now live in dnd5e_data instead of
# a copy-pasted tuning.py, resolved automatically (no [[combatants]] needs a
# local `sources` entry). Board: the abstract-mode featureless room (design
# doc 00 decision D5) with spawn blocks close enough that everyone reaches
# melee range within round 1, matching the old engine's boardless abstract
# mode.
#
# Baseline comparison note: the old engine's ledger columns use the party's
# short in-scenario names (fighter/ranger/rogue/cleric/wizard); this engine's
# instance names are the creature files' own canonical names
# (champion_fighter/hunter_ranger/thief_rogue/life_cleric/evoker_wizard) per
# design doc 01's "every creature file has a `name` field, used as its
# identity" rule — no per-sim aliasing layer. `scratch/check_otyugh_cr5_dps_
# parity.py` renames the baseline's columns to match before calling
# `simharness.stats.compare()`.
#
# PARITY STATUS (re-measured 2026-07 Bug-A follow-up, 10000 trials @ seed
# 20260701): the former ~54% monster-damage OVERSHOOT is FIXED — root cause was
# the thief_rogue (no Sneak Attack / Uncanny Dodge) and hunter_ranger (no
# Hunter's Mark / Colossus Slayer) dealing ~half their real damage and soaking
# too much, so the otyugh lived to act ~0.6 more turns/trial. See
# design/07-known-issues.md (Bug A) for the full diagnosis and the reusable
# primitives it added (reduce_damage/taking_damage, mark_turn/turn_marked, the
# Concentration pattern).
#   Now within/near tolerance: side_dealt_monsters/dealt_otyugh (~-6%),
#     dealt_hunter_ranger (~-3%), dealt_thief_rogue (~-3%), taken_thief_rogue
#     (~+16%, was +219%), dealt_evoker_wizard (~+2%).
#   Residual misses, documented: dealt_champion_fighter (~-13% — the party now
#     kills fast enough that the low-initiative fighter lands fewer non-overkill
#     hits; a redistribution effect, not a fighter bug); poisoned_otyugh (~0.48
#     vs 0.92 — cosmetic, the old Cunning Strike poison logic is unrecoverable,
#     see Bug B); dealt_life_cleric (tiny absolute, buff/heal build).
# The single-otyugh standard-party sibling sims (otyugh_cr5_compare/standard,
# otyugh_cr5_monk/standard_1x) share this fix and this ~-6% result. The
# multi-otyugh ones (otyugh_cr5_x2, _monk standard_2x) now UNDERshoot (~-25%):
# an inherent board-vs-abstract kiting difference, see 07's Bug A.
name = "otyugh_cr5_dps"
description = "Otyugh CR5 DPS check vs the adventurers party"

board = "lib:plain_room"

[simulation]
trials = 10000
max_rounds = 3
seed = 20260701

[[combatants]]
creature = "champion_fighter"
side = "party"
spawn = "party"

[[combatants]]
creature = "hunter_ranger"
side = "party"
spawn = "party"

[[combatants]]
creature = "thief_rogue"
side = "party"
spawn = "party"

[[combatants]]
creature = "life_cleric"
side = "party"
spawn = "party"

[[combatants]]
creature = "evoker_wizard"
side = "party"
spawn = "party"

[[combatants]]
creature = "otyugh"
side = "monsters"
spawn = "monsters"

[environment]
focus = "otyugh"

[output]
report = ["totals", "by_combatant"]
