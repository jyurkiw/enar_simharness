# Cathedral — pure-combat validation (NO objective/reinforcements yet). Standard
# level-6 party vs the full central-chamber horde on the cathedral board, run to
# 10 rounds. This is the step-04 milestone: it exists to prove the statblocks,
# the L6 PCs, and the board integrate and the fight resolves. The real extraction
# scenario (seal, box, retreat, reinforcement waves) is built in later steps as
# sims/cathedral/simulation.toml.
name = "cathedral_deathmatch"
description = "Level-6 standard party vs the Cathedral horde (deathmatch validation)"

board = "lib:cathedral"

