# Party (standard vs. Ranger-swapped-for-Monk) x Otyugh count (1 vs 2) — four
# variants total. Ported from dnd/otyugh/otyugh_cr5_monk's four scenario files
# (scenario_standard_1x/standard_2x/monk_1x/monk_2x.toml) into one sweep sim
# (design doc 05's migration checklist row 5). The old engine authored these
# as four separate scenario files rather than a true 2x2 product, so this
# uses one `[[sweep.axes]]` with all four explicit `combatants` lists baked
# in (matching the old structure) rather than two independently-swept axes
# (which would require the loader to merge two separate combatant lists —
# more machinery than four explicit variants need).
#
# `environment.focus` is currently inert (no party member's
# `[[behavior.targeting]]` uses `order = "focus"` yet — see behavior.py's
# `_order_pool`), so it's left at a fixed "otyugh" label across all four
# variants rather than varying it per-variant to match otyugh_1/otyugh_2.
name = "otyugh_cr5_monk"
description = "Standard vs Monk-swapped party against 1 or 2 CR5 Otyughs"

board = "lib:plain_room"

[simulation]
trials = 10000
max_rounds = 3
seed = 20260701

[[combatants]]
creature = "champion_fighter"
side = "party"
spawn = "party"

[[combatants]]
creature = "hunter_ranger"
side = "party"
spawn = "party"

[[combatants]]
creature = "thief_rogue"
side = "party"
spawn = "party"

[[combatants]]
creature = "life_cleric"
side = "party"
spawn = "party"

[[combatants]]
creature = "evoker_wizard"
side = "party"
spawn = "party"

[[combatants]]
creature = "otyugh"
side = "monsters"
spawn = "monsters"

[[sweep.axes]]
target = "combatants"
values = [
    # standard_1x: standard party, 1 otyugh
    [
        { creature = "champion_fighter", side = "party", spawn = "party" },
        { creature = "hunter_ranger", side = "party", spawn = "party" },
        { creature = "thief_rogue", side = "party", spawn = "party" },
        { creature = "life_cleric", side = "party", spawn = "party" },
        { creature = "evoker_wizard", side = "party", spawn = "party" },
        { creature = "otyugh", side = "monsters", spawn = "monsters" },
    ],
    # standard_2x: standard party, 2 otyughs
    [
        { creature = "champion_fighter", side = "party", spawn = "party" },
        { creature = "hunter_ranger", side = "party", spawn = "party" },
        { creature = "thief_rogue", side = "party", spawn = "party" },
        { creature = "life_cleric", side = "party", spawn = "party" },
        { creature = "evoker_wizard", side = "party", spawn = "party" },
        { creature = "otyugh", side = "monsters", spawn = "monsters", count = 2 },
    ],
    # monk_1x: ranger -> monk, 1 otyugh
    [
        { creature = "champion_fighter", side = "party", spawn = "party" },
        { creature = "open_hand_monk", side = "party", spawn = "party" },
        { creature = "thief_rogue", side = "party", spawn = "party" },
        { creature = "life_cleric", side = "party", spawn = "party" },
        { creature = "evoker_wizard", side = "party", spawn = "party" },
        { creature = "otyugh", side = "monsters", spawn = "monsters" },
    ],
    # monk_2x: ranger -> monk, 2 otyughs
    [
        { creature = "champion_fighter", side = "party", spawn = "party" },
        { creature = "open_hand_monk", side = "party", spawn = "party" },
        { creature = "thief_rogue", side = "party", spawn = "party" },
        { creature = "life_cleric", side = "party", spawn = "party" },
        { creature = "evoker_wizard", side = "party", spawn = "party" },
        { creature = "otyugh", side = "monsters", spawn = "monsters", count = 2 },
    ],
]

[sweep]
columns = ["side_dealt_party", "side_dealt_monsters"]

[environment]
focus = "otyugh"

[output]
report = ["totals", "by_combatant"]

# PARITY STATUS (re-measured 2026-07 Bug-A follow-up, 10000 trials @ seed
# 20260701): the former monster-damage overshoot is FIXED for the single-otyugh
# variants — it was the party missing class features, incl. the open_hand_monk
# (Flurry of Blows + Stunning Strike). See design/07-known-issues.md Bug A.
#   standard_1x: side_dealt_monsters ~-6% (was ~+12%).
#   monk_1x:     side_dealt_monsters ~+12% (was ~+73%).
#   monk_2x:     side_dealt_monsters ~-7% (was ~+16%).
#   standard_2x: side_dealt_monsters ~-26% — the ranger kites too safely on the
#     board in the longer 2-otyugh fight (keeps Hunter's Mark up); an inherent
#     board-vs-abstract difference, accepted (see 07 Bug A + otyugh_cr5_x2).
