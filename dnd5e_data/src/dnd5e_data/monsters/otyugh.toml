# Otyugh, CR 5. Ported from dnd5e_combat/monsters/otyugh/defaults.toml (SRD
# p.313) for exact stat fidelity (ac/hp/to-hit/damage/saves all match the old
# engine's real values, not the illustrative rewrite in design doc 01 section
# 1.11).
#
# PHASE 4: full grapple-state-gated multiattack (design doc 01 section 1.11 /
# design doc 04 section 2), replacing Phase 3's single always-selected
# `grab_two` fallback: `count(enemies_grappled_by_self)` selects grab_two (0),
# bite_and_grab (1), or slam_two (2+) exactly as
# dnd5e_combat/monsters/otyugh/__init__.py's take_turn does.
#
# Targeting fidelity (found via otyugh_cr5_dps parity measurement, Task #47):
# the old policy picks fresh tentacle targets with `ctx.choice` — a uniform
# random draw from the reachable pool, not "always the nearest" — and `bite`
# in the 1-grappled state always hits the existing captive, never a new
# target. Reproduced via `[[behavior.targeting]] order = "random"` (the
# default `nearest` was concentrating both grab_two tentacles, and
# bite_and_grab's second tentacle, on whichever party member happened to
# spawn closest) plus `tentacle`'s `target_filter` excluding whoever's
# already grappled and `bite`'s `enemies_grappled_by_self` targeting.
#
# DELIBERATE, PRE-REGISTERED SCOPE CUT (parity escalation rule, design doc 06):
# the old policy also has a tank/skirmisher pack-avoidance targeting rule
# (avoid tagged targets when an ally already has the tank grappled) and
# publishes `enemy_crit`/`slam_both_failed` round flags that life_cleric reacts
# to — both only matter in multi-otyugh or life-cleric-party sims. Left out of
# this shared creature file; `enemies_tagged`/`set_flag` are available if
# measured parity on otyugh_cr5_x2 (Task #48) or a life_cleric sim needs them,
# added there via `[overrides.otyugh]`, not baked into every solo sim.
name = "otyugh"
display_name = "Otyugh"

[classification]
size = "Large"
type = "Aberration"
alignment = "Neutral"
cr = 5

[stats]
strength = 16
dexterity = 10
constitution = 18
intelligence = 10
wisdom = 12
charisma = 10
ac = 14
speed = 30
initiative_bonus = 0

[stats.health]
average = 104

[stats.saves]
dexterity = 0
constitution = 7
wisdom = 1

[stats.senses]
darkvision = 120
passive_perception = 11

# Any creature with real (non-limited) darkvision ignores heavy obscurement
# outright (dnd5e_combat.battlefield.Battlefield.obscurement_immune: "anything
# with data['darkvision']") — matters once a darkness aura exists (Task #55's
# shadow otyugh sims): a plain Otyugh lurking in the Shadow's own darkness
# still sees out fine, even though it isn't the darkness's source.
[traits.darkvision]
effects = [ { effect = "darkvision_immunity" } ]

[abilities.bite]
kind = "attack"
to_hit = 6
damage = "2d8+3"
damage_type = "piercing"
targets = "enemies_grappled_by_self"   # only ever used in bite_and_grab: hits the captive

[abilities.tentacle]
kind = "attack"
to_hit = 6
damage = "2d8+3"
damage_type = "piercing"
target_filter = "not is_grappled_by(target, self)"   # a fresh target, never a current captive
on_hit = [ { effect = "attach_condition", condition = "grappled", escape_dc = 13 } ]

[abilities.tentacle_slam]
kind = "save"
ability = "constitution"
dc = 14
damage = "3d8+3"
damage_type = "bludgeoning"
half_on_save = true
targets = "enemies_grappled_by_self"
max_targets = 2
on_fail = [ { effect = "attach_condition", condition = "stunned" } ]

[multiattack.slam_two]                 # 2+ enemies grappled: slam them both
actions = ["tentacle_slam"]
when = "count(enemies_grappled_by_self) >= 2"
priority = 30

[multiattack.bite_and_grab]            # 1 grappled: bite the captive, grab another
actions = ["bite", "tentacle"]
when = "count(enemies_grappled_by_self) == 1"
priority = 20

[multiattack.grab_two]                 # none grappled: two tentacles, two targets
actions = ["tentacle", "tentacle"]
priority = 0                           # no `when` = the fallback

[behavior]
tactic = "engage"

[[behavior.targeting]]
order = "random"   # ctx.choice in the old policy: uniform, not nearest-first
