# Priest — MM Priest, CR 2. Standard 2024 MM values. Arrives with the Cathedral
# Guard reinforcement waves: Guiding Bolt for burst, Sacred Flame otherwise, and
# a Cure Wounds to keep the fresh guards standing.
name = "priest"
display_name = "Priest"

[classification]
size = "Medium"
type = "Humanoid"
cr = 2

[stats]
strength = 10
dexterity = 10
constitution = 12
intelligence = 13
wisdom = 16
charisma = 13
ac = 13
speed = 30
initiative_bonus = 0

[stats.health]
average = 27
hit_dice = "5d8+5"

[stats.senses]
passive_perception = 15

[abilities.mace]
kind = "attack"
to_hit = 2
damage = "1d6"
damage_type = "bludgeoning"
requires_sight = false

[abilities.guiding_bolt]
kind = "attack"
to_hit = 5
damage = "4d6"
damage_type = "radiant"
range_normal = 120
costs = { resource = "bolt_slots", amount = 1 }   # 3 casts, then Sacred Flame

[abilities.sacred_flame]
kind = "save"
ability = "dexterity"
dc = 13
damage = "1d8"
damage_type = "radiant"

[abilities.cure_wounds]
kind = "heal"
amount = "2d8+3"
targets = "downed_allies"

[multiattack.triage]
actions = ["cure_wounds"]
when = "count(downed_allies) > 0"
priority = 20

[multiattack.bolt]
actions = ["guiding_bolt"]
when = "resource_available('bolt_slots')"
priority = 10

[multiattack.standard]
actions = ["sacred_flame"]
priority = 0

[resources.bolt_slots]
uses = 3

[behavior]
tactic = "kite"
