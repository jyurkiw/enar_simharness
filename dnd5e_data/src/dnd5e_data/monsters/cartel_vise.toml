# Southern Gate Guard Cartel Vise, CR 2 — the payoff / capture piece of the
# cartel's mutual-dependency network. Converted from the Homebrewery statblock
# at enigma-narrative/.../southern-gate-guard-cartel/vise.md.
#
# Its whole design is CONDITIONAL: a Club is 5 damage against a free target, 12
# against a Grappled or Prone one, 19 against a Restrained one. That's modeled
# as one ability plus two mutually-exclusive `damage_rider`s rather than three
# abilities, because the tier depends on the *chosen target's* state, and a
# `[multiattack].when` is evaluated before targets exist (it only sees `self`).
# The riders read the final target, which is exactly the right scope.
#
#   base 1d6+2                        =  5 avg   (free target)
#   + 2d6 when Grappled/Prone         = 12 avg   (3d6+2)
#   + 4d6 when Restrained             = 19 avg   (5d6+2)
#
# The tiers do not stack: the Restrained rider excludes itself from the
# Grappled/Prone one, matching the statblock's "this attack INSTEAD deals".
#
# Targeting follows the payoff: a Restrained enemy first, then a Grappled/Prone
# one, then nearest. That's the Vise doing its job in the network — the Hound
# and Slinger set the table, the Vise eats.
#
# Manacle (1/Day) is the capture tool. RAW it's a DC 13 Dexterity (Sleight of
# Hand) *check*; the engine has no skill-check primitive, so it's modeled as a
# DC 13 Dexterity save — a close stand-in (a Dex-save-proficient PC resists a
# little better than RAW, a non-proficient one about the same). Restrained then
# has no escape clock: the statblock's escape DCs (20 / 25 / 15-with-tools) are
# all well out of reach mid-fight, so "until freed" is effectively permanent
# for the duration of the encounter, which is what `until_cured` gives.
name = "cartel_vise"
display_name = "Southern Gate Guard Cartel Vise"
# Intrinsic role tag — so a reinforcement wave (loader spawns those without
# combatant tags) still reads as a "vise" for the Constable's Commander's Strike
# filter and the retreat gate. Unions with any per-combatant tags.
tags = ["vise"]

[classification]
size = "Medium"
type = "Humanoid"
alignment = "Lawful Neutral"
cr = 2

[stats]
strength = 13
dexterity = 12
constitution = 14
intelligence = 10
wisdom = 12
charisma = 10
ac = 13
speed = 30
initiative_bonus = 1

[stats.health]
average = 91
hit_dice = "14d8+28"

[stats.saves]
strength = 3
dexterity = 1
constitution = 4
intelligence = 0
wisdom = 1
charisma = 0

[stats.senses]
passive_perception = 11

# The manacled condition: bound helpless. `grant_speed_zero` roots the target,
# and it also stands in for Restrained on the Vise's own damage tiers (the club
# riders below fire on manacled OR restrained). "One set of manacles" (a Vise
# holds one prisoner at a time) is enforced on the BIND OPTIONS via
# `not is_source_of('manacled')` — the Vise won't attempt a fresh bind while it
# already holds a prisoner, so it keeps its one captive rather than churning to a
# new target and freeing the old (which would feed a conscious prisoner back to
# the swarm).
#
# NOTE: whether a bound PC is then LEFT ALONE (captured, survivable) or clubbed
# further is controlled by the `neutralizes` flag, which is OFF here. The
# standalone `guard_cartel` skirmish wants the Vise to keep clubbing a bound
# target for its 19-damage Restrained tier; the opera-house scene wants capture
# (leave them helpless) and turns `neutralizes` on via a sim-local override,
# together with a Recharge for the manacles — see sims/opera_house.
[conditions.manacled]
grants = [ { effect = "grant_speed_zero" } ]
expires = "until_cured"
ends_with_source = false

[abilities.club]
kind = "attack"
to_hit = 3
damage = "1d6+2"
damage_type = "bludgeoning"
requires_sight = false          # a mundane weapon: swingable at what you can't see
on_hit = [
  { effect = "damage_rider", damage = "4d6", damage_type = "bludgeoning", name = "vise_restrained", when = "has_condition(target, 'restrained') or has_condition(target, 'manacled')" },
  { effect = "damage_rider", damage = "2d6", damage_type = "bludgeoning", name = "vise_held", when = "not has_condition(target, 'restrained') and not has_condition(target, 'manacled') and (has_condition(target, 'grappled') or has_condition(target, 'prone'))" },
]

# Manacle a CONTROLLED, still-conscious PC (grappled / stunned / restrained /
# incapacitated) — DC 13 Dex save, bound on a fail. This is the preference-piece:
# binding a controlled PC while it's still up leaves it conscious-but-helpless
# (survivable) instead of the swarm beating it to 0.
[abilities.manacle]
kind = "save"
ability = "dexterity"
dc = 13
targets = "enemies"
max_targets = 1
target_filter = "distance(self, target) <= 5 and not has_condition(target, 'manacled') and (has_condition(target, 'grappled') or has_condition(target, 'incapacitated') or has_condition(target, 'restrained') or has_condition(target, 'stunned'))"
costs = { resource = "manacles", amount = 1 }
on_fail = [ { effect = "attach_condition", condition = "manacled" } ]

# Manacle a DOWNED PC (0 HP, unconscious — no save, they're helpless). Binds them
# on the floor, so if an ally heals them back up they come to bound and rooted
# rather than free. `downed_enemies` is the Down-inclusive pool (`enemies`
# excludes the Down).
[abilities.manacle_downed]
kind = "utility"
targets = "downed_enemies"
max_targets = 1
target_filter = "distance(self, target) <= 5 and not has_condition(target, 'manacled')"
costs = { resource = "manacles", amount = 1 }
effects = [ { effect = "attach_condition", condition = "manacled" } ]

# Guard-issue manacles. One charge; `per = "day"` here (the standalone
# guard_cartel skirmish's once-per-fight capture tool). The opera-house scene
# overrides this to `recharge = "5-6"` — "pick up and re-use their manacles" —
# so the Vises keep binding across a long fight.
[resources.manacles]
uses = 1
per = "day"

# The squad breaks when the Constable goes down (see sims/guard_cartel). The
# Constable carries `tags = ["commander"]`; `allies_tagged` only sees the
# living, so this option arms itself the moment it drops.
[abilities.withdraw]
kind = "utility"
targets = "self"
effects = [ { effect = "end_trial", outcome = { squad_retreated = 1 } } ]

[multiattack.retreat]
actions = ["withdraw"]
when = "count(allies_tagged('commander')) == 0"
priority = 100

# THE MANACLE PREFERENCE. Binding a controlled, still-conscious PC is the top
# priority (above clubbing) — that's the capture the whole faction is built
# around, and it converts that PC to a survivable prisoner. Needs a charge
# available (the recharge gate).
[multiattack.bind]
actions = ["manacle"]
when = "resource_available('manacles') and not is_source_of('manacled') and any(enemies, distance(self, it) <= 5 and not has_condition(it, 'manacled') and (has_condition(it, 'grappled') or has_condition(it, 'incapacitated') or has_condition(it, 'restrained') or has_condition(it, 'stunned')))"
priority = 50

[multiattack.standard]
actions = ["club"]
priority = 0

# Bind a helpless downed PC only when there's no standing threat to club and no
# conscious prisoner to take — lowest priority, pure mop-up (see manacle_downed).
[multiattack.bind_downed]
actions = ["manacle_downed"]
when = "resource_available('manacles') and not is_source_of('manacled') and count(enemies_within(60)) == 0 and any(downed_enemies, distance(self, it) <= 5 and not has_condition(it, 'manacled'))"
priority = -10

# Commander's Strike hands this ability to the Vise as a reaction attack; the
# +1d8 comes from the Constable's effect call, not from here.
[abilities.commanded_strike]
kind = "attack"
to_hit = 3
damage = "1d6+2"
damage_type = "bludgeoning"
requires_sight = false
on_hit = [
  { effect = "damage_rider", damage = "4d6", damage_type = "bludgeoning", name = "vise_restrained", when = "has_condition(target, 'restrained') or has_condition(target, 'manacled')" },
  { effect = "damage_rider", damage = "2d6", damage_type = "bludgeoning", name = "vise_held", when = "not has_condition(target, 'restrained') and not has_condition(target, 'manacled') and (has_condition(target, 'grappled') or has_condition(target, 'prone'))" },
]
target_filter = "distance(self, target) <= 5"

[behavior]
tactic = "engage"

[[behavior.targeting]]
when = "has_condition(target, 'restrained')"
order = "nearest"
priority = 30

[[behavior.targeting]]
when = "has_condition(target, 'grappled') or has_condition(target, 'prone')"
order = "nearest"
priority = 20
