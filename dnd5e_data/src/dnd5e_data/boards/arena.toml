# Ported from dnd_board/src/dnd_board/data/boards/arena.txt (+ default.toml
# palette) per design doc 01 section 2. A 30x30 open arena split by a central
# wall with a gap, two pillars per side (3/4 cover), two low walls (1/2
# cover), and a patch of difficult terrain in one corner. Party spawns west,
# monster spawns east.
name = "arena"

map = """
..............................
..............................
..............................
..............................
..............................
..............................
...............#..............
...............#..............
...............#..............
...............#..............
...........o...#...o..........
...............#..............
...............#..............
..PP......................MM..
..PP......................MM..
..PP......................MM..
..PP...........#..........MM..
...............#..............
...............#..............
...........o...#...o..........
...............#..............
...............#..............
......xxxxx....#..............
...............#..............
....................~~~~~~....
....................~~~~~~....
....................~~~~~~....
....................~~~~~~....
..............................
..............................
"""

[meta]
cell_feet = 5
diagonal = "chebyshev"

[glyph.'#']
terrain = "impassable"
cover = "full"
blocks_los = true
blocks_light = true

[glyph.'o']
terrain = "impassable"
cover = "three_quarters"
blocks_los = false
blocks_light = false

[glyph.'x']
terrain = "impassable"
cover = "half"
blocks_los = false
blocks_light = false

[glyph.'~']
terrain = "difficult"

[glyph.'P']
terrain = "open"
spawn = "party"

[glyph.'M']
terrain = "open"
spawn = "monsters"
