# AUTO-DERIVED level-6 copy (see sims/cathedral). Base file kept unchanged.
# Life Domain Cleric, level 5. Ported from
# dnd5e_combat/characters/life_cleric/defaults.toml.
#
# PHASE 4: round-conditional opener — Bane (round 1), Bless if Bane didn't
# stick (round 2), Sacred Flame otherwise — now expressed via `round()`/
# `has_condition` `when` gates (design doc 04 section 2), matching
# dnd5e_combat/monsters/../life_cleric/__init__.py's take_turn. Bane/Bless's
# +-1d4 d20 dice are real now too (conditions.py's `d20_dice`, wired into
# actions.py this phase).
#
# BUG-C REBUILD (design doc 07): the old policy's top-of-turn triage ("if any
# ally is at 0 HP, drop everything and Cure Wounds them") was cut in Phase 4 and
# `cure_wounds` was left DEFINED BUT UNREACHABLE — no multiattack option ever
# selected it, and it had no `targets`, so had it ever been reached the default
# "visible enemies" pool would have aimed the heal at a monster. That missing
# triage was the reason the party's front-liners went Down ~5x more often than
# baseline while taking LESS total damage (they dropped early and then stopped
# being hit). Restored as the `triage` option below, now that the blockers are
# gone: `downed_allies` (a new selector — `allies` deliberately excludes the
# Down, so it could never see a dying ally) plus the priority ordering that
# makes triage pre-empt the Bane/Bless opener.
# STILL CUT (small): the post-spike divert ("after an enemy crit or a failed
# tentacle_slam save, heal instead of Sacred Flame") — `set_flag`/`has_flag`
# exist now, but nothing publishes an "enemy crit" flag yet.
name = "life_cleric_l6"
display_name = "Life Cleric (Lv6)"

[classification]
level = 6

[stats]
strength = 10
dexterity = 10
constitution = 14
intelligence = 10
wisdom = 18
charisma = 10
ac = 14
speed = 30
initiative_bonus = 0

[stats.health]
average = 45

[stats.saves]
constitution = 2

[abilities.sacred_flame]
kind = "save"
ability = "dexterity"
dc = 14
damage = "2d8"
damage_type = "radiant"

[abilities.cure_wounds]
kind = "heal"
amount = "1d8+7"
targets = "downed_allies"   # raise the dying, never "the nearest visible enemy"

[abilities.bane]
kind = "save"
ability = "wisdom"
dc = 14
on_fail = [ { effect = "attach_condition", condition = "bane" } ]

[abilities.bless]
kind = "utility"
targets = "allies"
effects = [ { effect = "attach_condition", condition = "bless" } ]

[multiattack.triage]                       # drop everything to raise a dying ally
actions = ["cure_wounds"]
when = "count(downed_allies) > 0"
priority = 40

[multiattack.bane_opener]
actions = ["bane"]
when = "round() == 1"
priority = 30

[multiattack.bless_opener]                 # only if Bane's target made its save
actions = ["bless"]
when = "round() == 2 and not has_condition(nearest_enemy, 'bane')"
priority = 20

[multiattack.standard]
actions = ["sacred_flame"]
priority = 0

[behavior]
tactic = "kite"
