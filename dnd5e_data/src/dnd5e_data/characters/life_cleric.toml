# Life Domain Cleric, level 5. Ported from
# dnd5e_combat/characters/life_cleric/defaults.toml. PHASE 3 SIMPLIFICATION:
# the old engine's triage logic (heal a downed ally first, cast Bane round 1,
# Bless round 2, then Sacred Flame — diverting to a heal after a party spike)
# is entirely round/state-conditional Python policy — TODO(phase4): needs
# `[[behavior.targeting]]`/conditional multiattack (`round() == 1`,
# `any(allies, is_down(it))`, `has_flag(...)`) to express. This file always
# casts Sacred Flame; `cure_wounds` is defined but not selected by any
# multiattack option yet.
name = "life_cleric"
display_name = "Life Cleric"

[classification]
level = 5

[stats]
strength = 10
dexterity = 10
constitution = 14
intelligence = 10
wisdom = 18
charisma = 10
ac = 14
speed = 30
initiative_bonus = 0

[stats.health]
average = 38

[stats.saves]
constitution = 2

[abilities.sacred_flame]
kind = "save"
ability = "dexterity"
dc = 14
damage = "2d8"
damage_type = "radiant"

[abilities.cure_wounds]
kind = "heal"
amount = "1d8+7"

[multiattack.standard]
actions = ["sacred_flame"]
priority = 0

[behavior]
tactic = "kite"
