# AUTO-DERIVED level-6 Evoker (see sims/cathedral). Base level-5 file untouched.
#
# Level 6 adds the evoker's Sculpt Spells and a real leveled-spell kit. For this
# big fight the wizard is budgeted THREE leveled spells: one each of 1st / 2nd /
# 3rd level (slot_1/slot_2/slot_3, one use apiece; a spell's `costs` spends its
# slot). Shield is a separate 2-use reaction (see cathedral step 08).
#   3rd: Fireball (20-ft sphere) OR Lightning Bolt (100-ft line) — one, not both
#   2nd: Shatter (10-ft sphere)
#   1st: Thunder Wave (15-ft cube from the caster)
# The EvokerBrainL6 hatch picks which to cast and where, Sculpt-aware.
name = "evoker_wizard_l6"
display_name = "Evoker Wizard (Lv6)"
# Sculpt Spells: aim evocations through up to 1+level allies (they take no damage).
tags = ["sculpt_spells"]

[classification]
level = 6

[stats]
strength = 10
dexterity = 10
constitution = 14
intelligence = 19
wisdom = 10
charisma = 10
ac = 11
speed = 30
initiative_bonus = 1

[stats.health]
average = 38

[stats.saves]
constitution = 2

# Spell-slot budget. A level-6 evoker has three 3rd-level slots — in a fight
# this desperate the wizard is expected to spend all THREE on Fireball (the
# `cast_fireball` multiattack option fires every round a cluster exists, up to
# this many casts: "use this ability up to X times when situation Z"). Plus one
# each of 1st/2nd.
[resources.slot_1]
uses = 1
[resources.slot_2]
uses = 1
[resources.slot_3]
uses = 3

[abilities.fire_bolt]
kind = "attack"
to_hit = 7
damage = "2d10"
damage_type = "fire"
range_normal = 120

[abilities.fireball]                       # 3rd level — 20-ft sphere, DC 15 Dex
kind = "save"
ability = "dexterity"
dc = 15
damage = "8d6"
damage_type = "fire"
half_on_save = true
area = { shape = "sphere", radius_ft = 20, range_ft = 150, level = 3 }
costs = { resource = "slot_3", amount = 1 }

[abilities.lightning_bolt]                 # 3rd level — 100-ft line, DC 15 Dex
kind = "save"
ability = "dexterity"
dc = 15
damage = "8d6"
damage_type = "lightning"
half_on_save = true
area = { shape = "line", length_ft = 100, level = 3 }
costs = { resource = "slot_3", amount = 1 }

[abilities.shatter]                        # 2nd level — 10-ft sphere, DC 15 Con
kind = "save"
ability = "constitution"
dc = 15
damage = "3d8"
damage_type = "thunder"
half_on_save = true
area = { shape = "sphere", radius_ft = 10, range_ft = 60, level = 2 }
costs = { resource = "slot_2", amount = 1 }

[abilities.thunderwave]                     # 1st level — 15-ft cube from caster, DC 15 Con
kind = "save"
ability = "constitution"
dc = 15
damage = "2d8"
damage_type = "thunder"
half_on_save = true
area = { shape = "cube", size_ft = 15, level = 1 }
costs = { resource = "slot_1", amount = 1 }
# NOTE: RAW also pushes failed targets 10 ft; push is deferred (logged in plan).

# Each leveled spell is its own multiattack option — the declarative
# "use ability A when situation Z, up to `costs` times" pattern. Selection is
# highest-priority ELIGIBLE option: Fireball outranks the rest, so as long as a
# 2+ cluster exists and a 3rd-level slot remains, the wizard casts Fireball
# EVERY round until all three slots are gone (the emergency feast), then Shatter,
# then Thunder Wave, then the cantrip. `aoe_targets(...)` is Sculpt-aware, so the
# cluster it counts can include the mob dogpiling the melee (allies auto-succeed).
# Raise a `when` threshold to make the wizard hold fire for bigger clusters.
[multiattack.cast_fireball]
actions = ["fireball"]
when = "resource_available('slot_3') and aoe_targets('fireball') >= 2"
priority = 40
[multiattack.cast_lightning]
actions = ["lightning_bolt"]
when = "resource_available('slot_3') and aoe_targets('lightning_bolt') >= 2"
priority = 30
[multiattack.cast_shatter]
actions = ["shatter"]
when = "resource_available('slot_2') and aoe_targets('shatter') >= 2"
priority = 20
[multiattack.cast_thunderwave]
actions = ["thunderwave"]
when = "resource_available('slot_1') and aoe_targets('thunderwave') >= 2"
priority = 10
[multiattack.standard]
actions = ["fire_bolt"]
priority = 0

[behavior]
tactic = "kite"

# Shield (reaction): +5 AC until the wizard's next turn, cast in response to
# being attacked. Two charges — the user's "once if attacked while below half
# health, once if attacked while everyone is retreating". The `party_retreating`
# flag is raised by the extraction plan (cathedral step 10); until then only the
# below-half trigger fires.
[resources.shield_charges]
uses = 2

[conditions.shielded]
grants = [ { effect = "grant_ac_bonus", amount = 5 } ]
expires = "start_of_source_next_turn"

[reactions.shield]
trigger = "self_targeted_by_attack"
when = "(hp_pct(self) < 0.5 or has_flag('party_retreating')) and resource_available('shield_charges')"
uses_reaction = true
effects = [
  { effect = "attach_condition", condition = "shielded" },
  { effect = "spend_resource", resource = "shield_charges" },
]
